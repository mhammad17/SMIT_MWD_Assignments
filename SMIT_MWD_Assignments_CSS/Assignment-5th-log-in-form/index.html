<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log in form</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="header">
        <div class="navbar">
            <h1>LOG IN <br> Responsive form</h1>
            <div class="box">
                <div class="login">
                <h1>Login <br><span class="form">Form</span> </h1>
                </div>
                <div class="input">
                    <div class="input1">
                        <h3>User name</h3>
                    <input type="text" placeholder="Enter your name">
                    </div>
                    <div class="input2">
                        <h3>Password</h3>
                    <input type="text number email month" placeholder="Enter your password">
                    </div>
                    <button class="button2" type="button">
                        Login
                    </button>
                </div>
            </div>
            <div class="result">
                 <div class="login2">
                <h1>Login</h1>
                </div>
                <div class="inputinput">
                    <div class="input3">
                        <h3>User name</h3>
                    <input type="text" placeholder="Enter your name">
                    </div>
                    <div class="input3">
                        <h3>Password</h3>
                    <input type="text number email month" placeholder="Enter your password">
                    </div>
                    <div class="button">
                    <button class="button1" type="button">
                    Login
                    </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
