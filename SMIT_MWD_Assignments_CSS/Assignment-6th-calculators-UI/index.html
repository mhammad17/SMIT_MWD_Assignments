<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calcultors UI</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
     <div class="hero-container">
    <div class="box1">
        <div class="top">
            <div class="icons">
                <div class="arrow">
                    <img src="download.png" alt="">
                </div>
                <div class="Equal">
                    <img src="download (2).png" alt="">
                </div>
                <div class="fourboxs">
                    <img src="download (3).png" alt="">
                </div>
                <div class="threedot">
                    <img src="download (4).png" alt="">
                </div>
            </div>
            <input class="input" type="number">
        </div>
        <div class="buttom">
            <table>
                <tr>
                    <td>C</td>
                    <td class="white"><img src="cross.png" alt=""></td>
                    <td class="green white">/</td>
                    <td class="green mult">*</td>
                </tr>
                <tr>
                    <td>7</td>
                    <td>8</td>
                    <td>9</td>
                    <td class="green">-</td>
                </tr>
                <tr>
                    <td>4</td>
                    <td>5</td>
                    <td>6</td>
                    <td rowspan="2" class="green">+</td>
                </tr>
                <tr>
                    <td>1</td>
                    <td>2</td>
                    <td>3</td>
                </tr>
                <tr>
                    <td class="tdimg"><img src="image.png" alt=""></td>
                    <td>0</td>
                    <td>.</td>
                    <td class="green">=</td>
                </tr>
            </table>
        </div>
    </div>
    <div class="box2">
        <div class="top2">
            <div class="icons">
                <div class="arrow">
                    <img src="download.png" alt="">
                </div>
                <div class="Equal">
                    <img src="download (2).png" alt="">
                </div>
                <div class="fourboxs">
                    <img src="download (3).png" alt="">
                </div>
                <div class="threedot">
                    <img src="download (4).png" alt="">
                </div>
            </div>
            <input class="input" type="number">
        </div>
        <div class="buttom2">
            <table>
                <tr>
                    <td>C</td>
                    <td class="white"><img src="cross.png" alt=""></td>
                    <td class="green white">/</td>
                    <td class="green mult">*</td>
                </tr>
                <tr>
                    <td>7</td>
                    <td>8</td>
                    <td>9</td>
                    <td class="green">-</td>
                </tr>
                <tr>
                    <td>4</td>
                    <td>5</td>
                    <td>6</td>
                    <td rowspan="2" class="green">+</td>
                </tr>
                <tr>
                    <td>1</td>
                    <td>2</td>
                    <td>3</td>
                </tr>
                <tr>
                    <td class="tdimg"><img src="image.png" alt=""></td>
                    <td>0</td>
                    <td>.</td>
                    <td class="green">=</td>
                </tr>
            </table>
        </div>
    </div>
    </div>
</body>
</html>
